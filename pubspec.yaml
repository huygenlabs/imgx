name: imgx
description: "Flutter package for loading images from URLs (PNG, JPG, WEBP, GIF) with memory/disk caching, expiration, retry mechanism, and progress tracking for smooth server handling."
version: 0.1.6
homepage: "https://github.com/huygenlabs/imgx"

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.8.1

topics:
  - image
  - image-loading
  - image-caching
  - image-download
  - image-retry

screenshots:
  - description: "The ImgX logo, an X built from pixels on a violet background."
    path: doc/icon.png
